<!doctype html><meta charset="utf-8"><title>Stillwave · cabin animation checks</title>
<style>body{font:15px system-ui;background:#17332f;color:#e6ecd4;margin:25px}button,a{background:#c4d7ad;color:#17332f;border:0;padding:12px 16px;border-radius:6px;margin:4px;cursor:pointer}pre{line-height:1.7;white-space:pre-wrap}.scene{position:relative;width:min(900px,100%);aspect-ratio:3/2;overflow:hidden}.scene img,.scene canvas{position:absolute;width:100%;height:100%;inset:0}.scene canvas:not(.active){visibility:hidden}.details{display:flex;gap:20px;flex-wrap:wrap;margin:20px 0}.details canvas{display:block;background:#102420;width:auto;height:360px;image-rendering:auto}</style>
<h1>Cabin animation checks</h1><p>Development page, excluded from publication.</p><button id="verify">Verify loop and motion regions</button><button id="play">Play / pause</button><button id="reduce">Toggle reduced motion</button><a href="./qa.html">Journey fixtures</a><pre id="result">Ready.</pre><div class="scene"><img id="art" src="./assets/cabin.webp"><canvas id="animation"></canvas></div>
<section class="details"><div><h2>Hearth and fixed grille</h2><canvas id="hearthZoom" width="260" height="340"></canvas></div><div><h2>Candle and fixed frame</h2><canvas id="candleZoom" width="240" height="360"></canvas></div><div><h2>Separate foliage</h2><canvas id="foliageZoom" width="300" height="340"></canvas></div></section>
<script type="module">
import {CabinAnimation} from './js/cabin.js?v=2.5.0';
const canvas=document.querySelector('#animation'),image=document.querySelector('img'),animation=new CabinAnimation(canvas,image),out=document.querySelector('pre');let playing=true,reduced=false;
const zooms=[['hearthZoom',[65,590,130,170]],['candleZoom',[426,475,72,108]],['foliageZoom',[120,225,282,320]]].map(([id,rect])=>({canvas:document.getElementById(id),rect}));
document.querySelector('#play').onclick=()=>playing=!playing;
document.querySelector('#reduce').onclick=()=>{reduced=!reduced;animation.setReducedMotion(reduced);out.textContent=reduced?'Reduced motion: original still image.':'Motion enabled.';};
function tick(now){if(playing)animation.draw(now);if(animation.ready&&!reduced)for(const zoom of zooms){const [x,y,w,h]=zoom.rect;zoom.canvas.getContext('2d').drawImage(canvas,x/1536*canvas.width,y/1024*canvas.height,w/1536*canvas.width,h/1024*canvas.height,0,0,zoom.canvas.width,zoom.canvas.height);}requestAnimationFrame(tick);}requestAnimationFrame(tick);
document.querySelector('#verify').onclick=async()=>{
 playing=false;const reports=[];const check=(ok,label)=>{reports.push((ok?'PASS ':'FAIL ')+label);out.textContent=reports.join('\n');if(!ok)throw new Error(label);};
 try{
  if(animation.pending)await animation.pending;else await animation.prepare();check(animation.ready,'Canvas renderer and artwork load');
  const render=time=>{animation.last=-Infinity;animation.start=0;animation.draw(time);return animation.ctx.getImageData(0,0,canvas.width,canvas.height).data;};
  const first=render(0),moved=render(3000),seam=render(24000);let seamError=0;for(let i=0;i<first.length;i++)seamError=Math.max(seamError,Math.abs(first[i]-seam[i]));check(seamError===0,'24-second loop seam is pixel-identical');
  const beforeSeam=render(23950),afterStart=render(50);const difference=(a,b)=>{let total=0;for(let i=0;i<a.length;i+=4)for(let c=0;c<3;c++)total+=Math.abs(a[i+c]-b[i+c]);return total/(a.length*.75);};check(difference(beforeSeam,first)<=difference(first,afterStart)*1.6+.03,'Crossing the seam has no larger jump than an ordinary frame');
  function delta(rect){let changed=0,total=0;for(let y=Math.ceil(rect[1]/1024*canvas.height);y<rect[3]/1024*canvas.height;y++)for(let x=Math.ceil(rect[0]/1536*canvas.width);x<rect[2]/1536*canvas.width;x++){const i=(y*canvas.width+x)*4;let difference=0;for(let ch=0;ch<3;ch++)difference+=Math.abs(first[i+ch]-moved[i+ch]);total++;if(difference>3)changed++;}return changed/total;}
  for(const [name,region] of [['Traveler',[610,455,740,565]],['Rain',[242,243,315,310]],['Foliage',[245,355,318,485]],['Steam',[965,515,1010,584]],['Hearth fire',[91,632,165,713]],['Desk candle',[441,506,481,546]],['Shelf candle',[801,239,826,270]],['Wall candle',[1305,173,1340,211]],['Window candle',[350,376,369,396]]]){const fraction=delta(region);check(fraction>.015,name+' moves: '+(fraction*100).toFixed(1)+'% of sampled pixels');}
  check(delta([1100,280,1210,520])===0,'Door and room remain stationary');
  check(delta([223,349,230,485])===0,'Window mullion stays fixed between moving fronds');
  animation.setReducedMotion(true);check(!canvas.classList.contains('active'),'Reduced motion reveals the original still');animation.setReducedMotion(false);
  const unavailable=document.createElement('canvas');unavailable.getContext=()=>null;const fallback=new CabinAnimation(unavailable,image);await fallback.prepare();check(fallback.disabled&&!unavailable.classList.contains('active'),'Unavailable canvas falls back without blocking the game');
  out.textContent=reports.join('\n')+'\nAll cabin checks complete.';playing=true;
 }catch(error){out.textContent=reports.join('\n')+'\nERROR '+error.message;}
};
</script>
