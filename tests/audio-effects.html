<!doctype html><html lang="en"><meta charset="utf-8"><title>Stillwave · effect regression checks</title><style>body{font:15px system-ui;background:#17332f;color:#e6ecd4;max-width:1000px;margin:40px auto;padding:30px}button{background:#c4d7ad;color:#17332f;border:0;padding:14px 20px;border-radius:7px;cursor:pointer}pre{line-height:1.9;white-space:pre-wrap}audio{width:100%}.players{display:grid;grid-template-columns:1fr 1fr;gap:25px}</style><h1>Stillwave · effect regression checks</h1><p>Local development page. Excluded from the published build.</p><button id="runEffects">Test the live music engine</button><pre id="out" aria-live="polite">Ready.</pre><section id="players" class="players"></section><script type="module">
import {MusicEngine,createMusicGraph,scheduleBar,barSeconds,delayParameters,encodeWav} from './js/music.js?v=2.1.1';
import {DEFAULT_MUSIC,LAYERS,REGIONS} from './js/data.js?v=2.1.1';
const $=id=>document.getElementById(id),lines=[];
function report(ok,msg){lines.push((ok?'PASS ':'FAIL ')+msg);$('out').textContent=lines.join('\n');if(!ok)throw new Error(msg);}
function energy(data,sr,start,end){let e=0;for(let i=Math.floor(start*sr);i<Math.min(data.length,Math.floor(end*sr));i++)e+=data[i]*data[i];return e;}
async function probe(delay,liveDelay){const sr=22050,ctx=new OfflineAudioContext(2,sr*2.4,sr),s={...structuredClone(DEFAULT_MUSIC),reverb:0,delay},graph=createMusicGraph(ctx,s,ctx.destination);if(liveDelay!==undefined){const engine=new MusicEngine(s,1);engine.ctx=ctx;engine.graph=graph;engine.set({...s,delay:liveDelay});}const osc=ctx.createOscillator(),g=ctx.createGain();osc.frequency.value=640;g.gain.value=.04;osc.connect(g);g.connect(graph.input);osc.start(.12);osc.stop(.18);const result=await ctx.startRendering();return {data:result.getChannelData(0),sr,time:delayParameters(s).time};}
async function clip(s,liveChorus){const sr=22050,ctx=new OfflineAudioContext(2,sr*8,sr),graph=createMusicGraph(ctx,s,ctx.destination);if(liveChorus!==undefined){const engine=new MusicEngine(s,991);engine.ctx=ctx;engine.graph=graph;engine.set({...s,chorus:liveChorus});}for(let bar=0,t=.05;t<7;bar++,t+=barSeconds(s))scheduleBar(ctx,graph,s,991,bar,t,7);return ctx.startRendering();}
$('runEffects').onclick=async()=>{lines.length=0;$('runEffects').disabled=true;$('out').textContent='Checking actual Web Audio output…';try{
 const dry=await probe(0),wet=await probe(.45),live=await probe(0,.45);const dryTail=energy(dry.data,dry.sr,.4,2.3),wetTail=energy(wet.data,wet.sr,.4,2.3),liveTail=energy(live.data,live.sr,.4,2.3);report(dryTail<1e-10&&wetTail>1e-5,'Tape delay produces real echoes: off '+dryTail.toExponential(2)+' / on '+wetTail.toExponential(2));const first=energy(wet.data,wet.sr,.12+wet.time,.32+wet.time),second=energy(wet.data,wet.sr,.12+2*wet.time,.32+2*wet.time);report(second>1e-6&&second<first,'Echo feedback creates quieter subsequent repeats');report(liveTail>wetTail*.7,'Changing the live delay control updates the actual audio graph');
 const s=structuredClone(DEFAULT_MUSIC);s.layers=Object.fromEntries(LAYERS.map(l=>[l,true]));s.density=1;s.swing=0;s.delay=0;const a=await clip(s),b=await clip({...s,swing:.28});let e=0,d=0;const ad=a.getChannelData(0),bd=b.getChannelData(0);for(let i=0;i<ad.length;i++){e+=ad[i]*ad[i];d+=(ad[i]-bd[i])**2;}report(Math.sqrt(d/e)>.12,'Swing changes the rendered rhythm: relative waveform difference '+Math.sqrt(d/e).toFixed(3));$('players').innerHTML='';for(const [label,result]of [['Straight rhythm',a],['Maximum swing',b]]){const data=new Blob([encodeWav([result.getChannelData(0),result.getChannelData(1)],result.sampleRate)],{type:'audio/wav'});const box=document.createElement('div');box.innerHTML=`<h3>${label}</h3><audio controls src="${URL.createObjectURL(data)}"></audio>`;$('players').append(box);}
 const rewardBase={...s,reverb:0,swing:0,layers:Object.fromEntries(LAYERS.map(l=>[l,l==='chords']))},plain=await clip(rewardBase),expanded=await clip({...rewardBase,bloom:1});let baseEnergy=0,delta=0;for(let i=0;i<plain.length;i++){const x=plain.getChannelData(0)[i],y=expanded.getChannelData(0)[i];baseEnergy+=x*x;delta+=(x-y)**2;}report(Math.sqrt(delta/baseEnergy)>.12,'The harmony reward changes the actual synthesized output: '+Math.sqrt(delta/baseEnergy).toFixed(3));
 const wide=await clip({...rewardBase,chorus:1}),liveWide=await clip(rewardBase,1);const width=result=>{let side=0,total=0;const left=result.getChannelData(0),right=result.getChannelData(1);for(let i=0;i<left.length;i++){side+=(left[i]-right[i])**2;total+=left[i]**2+right[i]**2;}return side/total;};report(width(plain)<1e-10&&width(wide)>.005,'The stereo reward creates audible left/right movement: '+width(wide).toFixed(3));report(width(liveWide)>width(wide)*.7,'Changing the live stereo reward control updates the audio graph');
 const loud={...s,swing:.28,delay:.45,reverb:1,bloom:1,chorus:1,volume:1,levels:Object.fromEntries(LAYERS.map(l=>[l,1]))};for(let genre=0;genre<REGIONS.length;genre++){const full=await clip({...loud,genre,bpm:REGIONS[genre].bpm});let peak=0,invalid=0,clipped=0;for(let ch=0;ch<full.numberOfChannels;ch++)for(const v of full.getChannelData(ch)){if(!Number.isFinite(v))invalid++;peak=Math.max(peak,Math.abs(v));if(Math.abs(v)>=1)clipped++;}report(invalid===0&&clipped===0&&peak>.01,REGIONS[genre].genre+' stays finite and unclipped with both rewards and maximum effects: peak '+peak.toFixed(3));}$('out').textContent=lines.join('\n')+'\nAll effect checks complete.';
 }catch(e){$('out').textContent=lines.join('\n')+'\nERROR '+e.message;}finally{$('runEffects').disabled=false;}};
</script></html>
