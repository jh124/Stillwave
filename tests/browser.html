<!doctype html><html><head><meta charset="utf-8"><title>Stillwave browser verification</title><style>body{font:15px system-ui;background:#14332f;color:#e9ecd5;padding:40px;max-width:1000px;margin:auto}button,a{display:inline-block;color:#14332f;background:#c7d8b3;border:0;border-radius:5px;padding:14px 20px;margin:8px;cursor:pointer}pre{white-space:pre-wrap;line-height:1.8}audio{display:block;width:100%;margin:20px 0}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.panel{aspect-ratio:1;background-image:url('./assets/worlds.webp');background-size:300% 200%;border-radius:10px;position:relative}.panel span{position:absolute;bottom:12px;left:12px;text-shadow:0 2px 6px #000}canvas{width:100%;display:block}</style></head><body><h1>Stillwave · browser verification</h1><p>Local development page. Excluded from the published build.</p><button id="audioTest">Render all six genres</button><button id="victoryFixture">Open completed archive fixture</button><button id="bossFixture">Open final guardian fixture</button><button id="resetFixture">Open fresh archive fixture</button><button id="phoneLayout">Show phone layout</button><div id="phoneFrame"></div><pre id="results" aria-live="polite">Ready.</pre><div id="samples"></div><div class="row" id="gallery"></div><script type="module">
import {MusicEngine,encodeWav} from './js/music.js';
import {DEFAULT_MUSIC,REGIONS,UNLOCKS,BASE_UNLOCKS,LAYERS} from './js/data.js';
import {readArchive,writeArchive,clearRun,writeRun} from './js/save.js';
const $=id=>document.getElementById(id),all=[...new Set([...BASE_UNLOCKS,...UNLOCKS.map(u=>u.id)])];
$('gallery').innerHTML=REGIONS.map((r,i)=>`<div class="panel" style="background-position:${i%3*50}% ${i>2?100:0}%"><span>${r.genre} · ${r.name}</span></div>`).join('');
$('audioTest').onclick=async()=>{const results=[];$('audioTest').disabled=true;$('samples').innerHTML='';for(let genre=0;genre<6;genre++){const s=structuredClone(DEFAULT_MUSIC);s.genre=genre;s.bpm=REGIONS[genre].bpm;s.instruments.chords=REGIONS[genre].gift.split(':')[1];s.instruments.melody=genre===4?'glass':'bell';s.layers=Object.fromEntries(LAYERS.map(l=>[l,true]));s.reverb=.4;s.delay=.2;const engine=new MusicEngine(s,6681);$('results').textContent=results.join('\n')+'\nRendering '+REGIONS[genre].genre+'…';const blob=await engine.renderMinute(s,6681),buffer=await blob.arrayBuffer(),view=new DataView(buffer),frames=(buffer.byteLength-44)/4;let energy=0,peak=0,fingerprint=0;for(let i=44;i<buffer.byteLength;i+=2){const v=view.getInt16(i,true)/32768;energy+=v*v;peak=Math.max(peak,Math.abs(v));if(i%4000===44)fingerprint+=v;}const rms=Math.sqrt(energy/(frames*2));const pass=frames/44100===60&&peak>.01&&peak<=1&&rms>.003;results.push(`${pass?'PASS':'FAIL'} ${REGIONS[genre].genre}: ${(frames/44100).toFixed(3)} seconds, stereo ${view.getUint16(22,true)}ch, ${view.getUint32(24,true)}Hz, peak ${peak.toFixed(3)}, RMS ${rms.toFixed(3)}, fingerprint ${fingerprint.toFixed(5)}`);const el=document.createElement('div');el.innerHTML=`<h3>${REGIONS[genre].genre}</h3><audio controls src="${URL.createObjectURL(blob)}"></audio>`;$('samples').append(el);}$('results').textContent=results.join('\n')+'\nAll renders complete.';$('audioTest').disabled=false;};
function fixture(done,boss=false){const a=readArchive();a.unlocks=done||boss?all:[...BASE_UNLOCKS];a.cleared=done;a.bosses=done?REGIONS.map(r=>r.id):[];a.runs=0;a.kills=0;a.music=structuredClone(DEFAULT_MUSIC);writeArchive(a);clearRun();if(boss)writeRun({version:1,seed:8732,weapon:'bow',difficulty:'gentle',area:5,passage:8,elapsed:3700,kills:1000,boons:['edge','edge','heart','flow'],health:128,herbs:4});location.href='./';}
$('phoneLayout').onclick=()=>{$('phoneFrame').innerHTML='<iframe title="Phone layout preview" src="./" style="width:390px;height:844px;border:1px solid #bccc9f;border-radius:10px"></iframe>';};
$('victoryFixture').onclick=()=>fixture(true);$('bossFixture').onclick=()=>fixture(false,true);$('resetFixture').onclick=()=>fixture(false);
</script></body></html>
